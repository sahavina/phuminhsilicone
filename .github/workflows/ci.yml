name: CI

on:
  push:
    branches: [ main, 'scc/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} — lint + smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: php -l
        run: |
          set -e
          git ls-files '*.php' | xargs -n1 -P4 php -l > /dev/null

      - name: Smoke test (không cần WordPress)
        run: php tests/smoke.php

  build:
    name: Build JS/CSS và kiểm tra build/ đã commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint JS
        run: npm run lint:js

      - name: Lint SCSS
        run: npm run lint:css

      # JS không qua build (saha-core public, theme assets) không nằm trong lint:js — ít nhất phải parse được.
      - name: Cú pháp JS không qua build
        run: |
          set -e
          git ls-files 'wp-content/plugins/saha-core/*.js' 'wp-content/themes/saha-theme/assets/js/*.js' | xargs -n1 node --check

      - name: Unit test JS (store builder)
        run: npm run test:js

      - run: npm run build

      # build/ được commit để deploy bằng rsync không cần Node (TECHNICAL-DESIGN D9).
      # Nếu ai đó sửa src/ mà quên build lại, bước này sẽ báo lỗi.
      - name: build/ khớp với src/
        run: git diff --exit-code -- wp-content/plugins/saha-builder/build wp-content/themes/saha-theme/assets/build
